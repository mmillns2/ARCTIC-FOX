<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ARCTIC FOX — Controller</title>

<style>
body{
margin:0;
font-family:Arial;
background:#fafafa;
}

header{
background:white;
padding:10px 15px;
border-bottom:1px solid #ccc;
display:flex;
justify-content:space-between;
align-items:center;
}

nav a{
margin-left:10px;
text-decoration:none;
color:#004;
font-weight:600;
}

.container{
display:flex;
gap:20px;
padding:15px;
flex-wrap:wrap;
}

.channel{
border:1px solid #ddd;
padding:12px;
width:320px;
border-radius:6px;
background:white;
}

.row{
display:flex;
gap:8px;
margin-bottom:6px;
}

input{
padding:6px;
width:120px;
}

button{
padding:6px 10px;
cursor:pointer;
}

.on{background:lightgreen;}
.off{background:lightcoral;}

.state-on{background:green;}
.state-off{background:red;}

#hw-btn.connected{background:lightgreen;}
#hw-btn.disconnected{background:lightcoral;}
#hw-btn:disabled{cursor:not-allowed;opacity:0.7;}


</style>
</head>

<body>

<header>
<h2>Controller</h2>
<nav>
<a href="/algorithm">Algorithm</a>
<a href="/interactive">Display</a>
</nav>
</header>

<button
  id="hw-btn"
  class="{{ 'connected' if hardware_connected else 'disconnected' }}"
  onclick="reconnect()">
  {{ 'Connected' if hardware_connected else 'Disconnected' }}
</button>

<div class="container">

{% for ch in channels %}

{% set cid = ch.replace(" ","_").replace("[","").replace("]","") %}
{% set units = channel_info[ch][2] %}

<div class="channel">

<div>
<strong>
{{ ch.replace(" [K]", "") }}
{% if channel_info[ch][2] %}
({{ channel_info[ch][2] }})
{% endif %}
</strong>
</div>

<div class="row">

<input
type="number"
step="0.01"
id="{{cid}}-val"
value="{{ last_values.get(ch) or '' }}"
>


<button onclick="setValue('{{ch}}','{{cid}}')">
Set
</button>

</div>

<div class="row">

<button
id="{{cid}}-off"
class="{{ last_states.get(ch,'off') }}"
onclick="turnOff('{{ch}}','{{cid}}')">

Turn Off

</button>

</div>

</div>

{% endfor %}

</div>

<script>

const typing = {};

function attachTypingListeners(){

document.querySelectorAll("input").forEach(inp=>{

inp.addEventListener("focus",()=>typing[inp.id]=true);
inp.addEventListener("blur",()=>typing[inp.id]=false);

});

}

window.addEventListener("DOMContentLoaded",attachTypingListeners);

async function postJSON(url,body){

const res = await fetch(url,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(body)
});

return res.json().catch(()=>{});

}

function setValue(channel,cid){

const el = document.getElementById(`${cid}-val`);
const value = parseFloat(el.value);

if(isNaN(value)){
alert("Enter number");
return;
}

postJSON('/api/set_value',{channel,value});

}

function turnOff(channel,cid){

postJSON('/api/turn_off',{channel});

}

function setHwButton(connected){
    const btn = document.getElementById("hw-btn");
    btn.className = connected ? "connected" : "disconnected";
    btn.textContent = connected ? "Connected" : "Disconnected";
}

async function reconnect(){
    const btn = document.getElementById("hw-btn");
    btn.disabled = true;
    btn.textContent = "Connecting…";
    try {
        const res = await fetch("/api/reconnect", {method:"POST"});
        const data = await res.json();
        if(data.status === "ok"){
            location.reload();
        } else {
            alert("Reconnect failed: " + (data.msg || "unknown error"));
            setHwButton(false);
        }
    } catch(e) {
        alert("Reconnect failed: could not reach server");
        setHwButton(false);
    } finally {
        btn.disabled = false;
    }
}

function refreshStates(){

fetch("/api/controller_state")

.then(res=>res.json())

.then(data=>{

for(const ch in data.values){

const cid = ch.replaceAll(" ","_").replaceAll("[","").replaceAll("]","");

const el = document.getElementById(`${cid}-val`);

if(el && !typing[el.id])
el.value = data.values[ch] ?? "";

}

for(const ch in data.states){

const cid = ch.replaceAll(" ","_").replaceAll("[","").replaceAll("]","");

const btn = document.getElementById(`${cid}-off`);
const dot = document.getElementById(`${cid}-dot`);

if(!btn) continue;

const state = data.states[ch];

btn.className = state;

}

});

fetch("/api/hardware_status")
.then(res=>res.json())
.then(data=>setHwButton(data.connected));

}

setInterval(refreshStates,1000);

</script>

</body>
</html>

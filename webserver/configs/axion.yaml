ports:
  webserver: 8083
  controller: 8084
  database: 8082

database:
  host: localhost
  user: axion_writer
  name: axion_db

channels:
  4HePotA [K]:
    backend: readout
    temperature:
      device: Lakeshore350
      channel: A
    webserver:
      controller: False
      display: True

  4pumpA [K]:
    backend: software_pid
    temperature:
      device: Lakeshore218
      channel: 2
    actuator:
      device: MX103QP
      channel: 1
    pid:
      kp: 6.0
      ki: 0.01
      kd: 0
      out_min: 0.0 
      out_max: 30.0
      ramp_rate: 6.0
      autotune_enabled: True
    webserver:
      controller: True
      units: K
      display: True
      algorithm: 4pumpA

  4switchA [K]:
    backend: manual
    temperature:
      device: Lakeshore218
      channel: 3
    actuator:
      device: GPDX303SA
      channel: 1
    pid:
      kp: 1.6
      ki: 0.0
      kd: 0
      out_min: 0.0 
      out_max: 30.0
      ramp_rate: 6.0
      autotune_enabled: False
    webserver:
      controller: True
      units: V 
      display: True
      algorithm: 4switchA

  4pumpAheat [V]:
    backend: readout_V
    voltage:
      device: MX103QP
      channel: 1

  4switchAheat [V]:
    backend: readout_V
    voltage:
      device: GPDX303SA
      channel: 1

  3HePotA [K]:
    backend: readout
    temperature:
      device: Lakeshore350
      channel: B
    webserver:
      controller: False
      display: True

  3pumpA [K]:
    backend: software_pid
    temperature:
      device: Lakeshore218
      channel: 5
    actuator:
      device: MX103QP
      channel: 2
    pid:
      kp: 6.0
      ki: 0.01
      kd: 0.0
      out_min: 0.0 
      out_max: 30.0
      ramp_rate: 6.0
      autotune_enabled: True
      stage1_setpoint: 19.0     # K, intermediate
      stage1_duration: 180      # seconds
    webserver:
      controller: True
      units: K
      display: True
      algorithm: 3pumpA

  3switchA [K]:
    backend: manual
    temperature:
      device: Lakeshore218
      channel: 6
    actuator:
      device: GPDX303SA
      channel: 2
    pid:
      kp: 2.0
      ki: 0.02
      kd: 0
      out_min: 0.0 
      out_max: 30.0
      ramp_rate: 10.0
      autotune_enabled: False
    webserver:
      controller: True
      units: V
      display: True
      algorithm: 3switchA

  3pumpAheat [V]:
    backend: readout_V
    voltage:
      device: MX103QP
      channel: 2

  3switchAheat [V]:
    backend: readout_V
    voltage:
      device: GPDX303SA
      channel: 2

  4HePotB [K]:
    backend: readout
    temperature:
      device: Lakeshore350
      channel: C
    webserver:
      controller: False
      display: True

  4pumpB [K]:
    backend: software_pid
    temperature:
      device: Lakeshore218
      channel: 1
    actuator:
      device: MX103QP
      channel: 4
    pid:
      kp: 6.0
      ki: 0.01
      kd: 0.0
      out_min: 0.0 
      out_max: 30.0
      ramp_rate: 6.0
      autotune_enabled: True
    webserver:
      controller: True
      units: K
      display: True
      algorithm: 4pumpB

  4switchB [K]:
    backend: manual
    temperature:
      device: Lakeshore218
      channel: 7
    actuator:
      device: GPDX303SB
      channel: 1
    pid:
      kp: 1.5
      ki: 0.01
      kd: 0
      out_min: 0.0 
      out_max: 30.0
      ramp_rate: 6.0
      autotune_enabled: False
    webserver:
      controller: True
      units: V
      display: True
      algorithm: 4switchB
  
  4pumpBheat [V]:
    backend: readout_V
    voltage:
      device: MX103QP
      channel: 4

  4switchBheat [V]:
    backend: readout_V
    voltage:
      device: GPDX303SB
      channel: 1

  3HePotB [K]:
    backend: readout
    temperature:
      device: Lakeshore350
      channel: D1
    webserver:
      controller: False
      display: True

  3pumpB [K]:
    backend: software_pid
    temperature:
      device: Lakeshore218
      channel: 4
    actuator:
      device: MX103QP
      channel: 3
    pid:
      kp: 6.0
      ki: 0.01
      kd: 0.0
      out_min: 0.0 
      out_max: 30.0
      ramp_rate: 6.0
      autotune_enabled: True
      stage1_setpoint: 19.0     # K, intermediate
      stage1_duration: 180      # seconds
    webserver:
      controller: True
      units: K
      display: True
      algorithm: 3pumpB

  3switchB [K]:
    backend: manual
    temperature:
      device: Lakeshore218
      channel: 8
    actuator:
      device: GPDX303SB
      channel: 2
    pid:
      kp: 1.5
      ki: 0.02
      kd: 0
      out_min: 0.0 
      out_max: 30.0
      ramp_rate: 6.0
      autotune_enabled: False
    webserver:
      controller: True
      units: V 
      display: True
      algorithm: 3switchB

  3pumpBheat [V]:
    backend: readout_V
    voltage:
      device: MX103QP
      channel: 3

  3switchBheat [V]:
    backend: readout_V
    voltage:
      device: GPDX303SB
      channel: 2

  MC [K]:
    backend: readout
    temperature:
      device: Lakeshore372
      channel: 1
    webserver:
      controller: False
      display: True

  Still [K]:
    backend: software_pid
    temperature:
      device: Lakeshore372
      channel: A
    actuator:
      device: Lakeshore372
      channel: 0
    pid:
      kp: 195       
      ki: 20.0
      kd: 3.0
      out_min: 20.0 
      out_max: 90.0
      ramp_rate: 0.5
      autotune_enabled: False
      use_threshold: True
      threshold: 3.0          
      recapture: 0.800
    webserver:
      controller: True
      units: 'K' 
      display: True

  Condenser [K]:
    backend: readout
    temperature:
      device: Lakeshore372
      channel: 2
    webserver:
      controller: False
      display: True

  Stillheat [%V]:
    backend: readout_V
    voltage:
      device: Lakeshore372
      channel: 0

  50K [K]:
    backend: readout
    temperature:
      device: Lakeshore336
      channel: D
    webserver:
      controller: False
      display: True

  4K [K]:
    backend: readout
    temperature:
      device: Lakeshore336
      channel: C
    webserver:
      controller: False
      display: True

  4HePotA [R]:
    backend: readout_R
    resistance:
      device: Lakeshore350
      channel: A

  4pumpA [V]:
    backend: readout_V
    voltage:
      device: Lakeshore218
      channel: 2

  4switchA [V]:
    backend: readout_V
    voltage:
      device: Lakeshore218
      channel: 3
    
  3HePotA [R]:
    backend: readout_R
    resistance:
      device: Lakeshore350
      channel: B

  3pumpA [V]:
    backend: readout_V
    voltage:
      device: Lakeshore218
      channel: 5

  3switchA [V]:
    backend: readout_V
    voltage:
      device: Lakeshore218
      channel: 6

  4HePotB [R]:
    backend: readout_R
    resistance:
      device: Lakeshore350
      channel: C

  4pumpB [V]:
    backend: readout_V
    voltage:
      device: Lakeshore218
      channel: 1

  4switchB [V]:
    backend: readout_V
    voltage:
      device: Lakeshore218
      channel: 7
  
  3HePotB [R]:
    backend: readout_R
    resistance:
      device: Lakeshore350
      channel: D1

  3pumpB [V]:
    backend: readout_V
    voltage:
      device: Lakeshore218
      channel: 4
      
  3switchB [V]:
    backend: readout_V
    voltage:
      device: Lakeshore218
      channel: 8

  MC [R]:
    backend: readout_R
    resistance:
      device: Lakeshore372
      channel: 1

  Still [R]:
    backend: readout_R
    resistance:
      device: Lakeshore372
      channel: A

  Condenser [R]:
    backend: readout_R
    resistance:
      device: Lakeshore372
      channel: 2

  50K [V]:
    backend: readout_V
    voltage:
      device: Lakeshore336
      channel: D

  4K [V]:
    backend: readout_V
    voltage:
      device: Lakeshore336
      channel: C







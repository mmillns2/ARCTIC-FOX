 #     channel: 4pump

 # 4switchBheat [V]:
 #   backend: readout_V
 #   voltage:
 #     device: CTC100B
 #     channel: 4switch

  3HePotB [K]:
    backend: readout
    temperature:
      device: Lakeshore224
      channel: D1
    webserver:
      controller: False
      display: True

  3pumpB [K]:
    backend: hardware_pid
    temperature:

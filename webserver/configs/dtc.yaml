  MC [K]:
    backend: readout
    temperature:
      device: Lakeshore372
      channel: 1
    webserver:
      controller: False
      display: True

  Still [K]:
    backend: manual
    temperature:
      device: Lakeshore372
      channel: A
    actuator:
      device: Lakeshore372
      channel: 0
    webserver:
      controller: True
      units: '%'
      display: True

  Condenser [K]:
    backend: readout
    temperature:
      device: Lakeshore224
      channel: A
    webserver:
      controller: False
      display: True

 # Stillheat [%V]:

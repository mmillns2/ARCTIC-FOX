ports:
  webserver: 8087
  controller: 8086
  database: 8085

database:
  host: localhost
  user: dtc_writer
  name: dtc_db

channels:
  4HePotA [K]:
    backend: readout
    temperature:
      device: Lakeshore224
      channel: C1
    webserver:
      controller: False
      display: True

  4pumpA [K]:
    backend: hardware_pid
    temperature:
      device: CTC100A
      channel: 4pump
    actuator:
      device: CTC100A
      channel: 4puheat
    webserver:
      controller: True
      units: K
      display: True
      algorithm: 4pumpA

  4switchA [K]:
    backend: manual
    temperature:
      device: CTC100A
      channel: 4switch
    actuator:
      device: CTC100A
      channel: 4swheat
    webserver:
      controller: True
      units: V
      display: True
      algorithm: 4switchA

#  4pumpAheat [V]:
